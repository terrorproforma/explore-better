version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # beta.14 is an intentional pin (see PRODUCT_TESTING.md): beta.15 only adds
      # a 5 s ConPTY worker timeout that kills slow-starting terminals.
      - dependency-name: node-pty
        versions: ["1.2.0-beta.15"]

  - package-ecosystem: gomod
    directories:
      - /native/fshelper
      - /native/mcpserver
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
