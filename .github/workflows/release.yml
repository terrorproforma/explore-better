name: Build attested Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every job declares the least privilege it needs. Dependency installation and
# the build never receive a token that can write to the repository.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Windows CI gate
    uses: ./.github/workflows/windows-ci.yml
    permissions:
      contents: read

  # Unsigned build: the only build until the repository variables described in
  # docs/CODE_SIGNING.md exist, and afterwards still the build for untagged manual
  # runs. It never receives an OIDC token. Its steps are unchanged from the
  # pre-signing workflow; keep them in sync with build-signed below.
  build:
    needs: test
    if: ${{ !(startsWith(github.ref, 'refs/tags/') && (vars.AZURE_SIGNING_ENDPOINT != '' || vars.AZURE_SIGNING_ACCOUNT != '' || vars.AZURE_SIGNING_PROFILE != '' || vars.AZURE_SIGNING_PUBLISHER_NAME != '')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EXPLORE_BETTER_DISABLE_STATE_WATCH: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache-dependency-path: |
            native/fshelper/go.mod
            native/mcpserver/go.sum
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Confirm release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the package version." }
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }
      - name: Build installer and update metadata
        run: |
          $releaseSteps = @('package:installer', 'verify:packaged-terminal', 'build:mcpb', 'verify:mcpb', 'verify:mcp-release', 'verify:brand', 'build:update-feed', 'build:release-checksums', 'verify:release-checksums')
          foreach ($releaseStep in $releaseSteps) {
            npm run $releaseStep
            if ($LASTEXITCODE -ne 0) { throw "Release step failed: $releaseStep" }
          }
      - name: Record current Authenticode status
        run: npm run verify:production-signing
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExploreBetter-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          path: |
            dist/ExploreBetter-*-x64-setup.exe
            dist/ExploreBetter-*-x64-setup.exe.blockmap
            dist/update-feed/latest.yml
            dist/SHA256SUMS.txt
            dist/mcp/ExploreBetter-MCP-*-windows-x64.mcpb
            dist/mcp/SHA256SUMS-mcp.txt
            dist/mcp/manifest.json
            dist/mcp/server.json
            artifacts/production-signing-latest.md

  # Signed build with Microsoft Artifact Signing. For tags it replaces `build` as soon
  # as any AZURE_SIGNING_* repository variable is set; a partial configuration fails
  # here instead of silently shipping unsigned. Owner setup: docs/CODE_SIGNING.md.
  #
  # Why sign inside the electron-builder run rather than in a later job: the order is
  # load-bearing. The app executable and the resources\native helpers must be signed
  # before NSIS embeds them, the uninstaller before the installer is compiled, and the
  # installer before its blockmap, latest.yml and SHA256SUMS are hashed. A separate
  # signing job would have to unpack, sign and re-run NSIS, i.e. package twice.
  # The cost is id-token: write in a job that runs npm-installed code, bounded by:
  #   - only this job has the permission, and it runs only for tags once configured;
  #   - Azure trusts only the `release-signing` environment (restricted to v* tags);
  #   - npm ci and the pre-packaging build steps run BEFORE azure/login, and the Azure
  #     session is cleared straight after packaging, before the remaining steps;
  #   - no client secret exists: azure/login exchanges a short-lived OIDC token for a
  #     service principal that holds only the Certificate Profile Signer role.
  # Residual risk: code already on the runner (npm dependencies, electron-builder) can
  # request an OIDC token while this job runs. That is inherent to letting the
  # packager sign; the lockfile, npm audit and the tag-only environment bound it.
  build-signed:
    name: build (signed)
    needs: test
    if: startsWith(github.ref, 'refs/tags/') && (vars.AZURE_SIGNING_ENDPOINT != '' || vars.AZURE_SIGNING_ACCOUNT != '' || vars.AZURE_SIGNING_PROFILE != '' || vars.AZURE_SIGNING_PUBLISHER_NAME != '')
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      EXPLORE_BETTER_DISABLE_STATE_WATCH: "1"
    steps:
      - name: Check signing configuration
        shell: pwsh
        env:
          SIGNING_VAR_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          SIGNING_VAR_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SIGNING_VAR_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_VAR_AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_VAR_AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_VAR_AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGNING_VAR_AZURE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME }}
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE', 'AZURE_SIGNING_PUBLISHER_NAME')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable("SIGNING_VAR_$_")) })
          if ($missing.Count -gt 0) {
            throw "Code signing is partly configured. Set these repository variables (docs/CODE_SIGNING.md) or remove every AZURE_SIGNING_* variable: $($missing -join ', ')"
          }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache-dependency-path: |
            native/fshelper/go.mod
            native/mcpserver/go.sum
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Confirm release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the package version." }
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }
      # The same prepackage steps `npm run package:installer` runs, finished before
      # any Azure credential exists on the runner.
      - name: Build packaging inputs before signing in to Azure
        run: |
          npm run prepackage:installer
          if ($LASTEXITCODE -ne 0) { throw "Release step failed: prepackage:installer" }
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The OIDC assertion azure/login used expires within minutes; obtaining the
      # Artifact Signing token now caches it (about an hour) for every signature.
      - name: Obtain the Artifact Signing access token
        run: |
          az account get-access-token --resource https://codesigning.azure.net --output none
          if ($LASTEXITCODE -ne 0) { throw "Could not obtain an Artifact Signing access token. Check the federated credential subject." }
      # electron-builder signs (timestamped, SHA-256) the app executable, the packaged
      # resources\native helpers, elevate.exe, the uninstaller and the installer, and
      # writes publisherName into app-update.yml. forceCodeSigning fails the build if
      # any signature fails.
      - name: Package and sign installer
        env:
          EXPLORE_BETTER_AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          EXPLORE_BETTER_AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          EXPLORE_BETTER_AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          EXPLORE_BETTER_AZURE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME }}
        run: |
          node scripts/run-electron-builder.mjs --win nsis
          if ($LASTEXITCODE -ne 0) { throw "Release step failed: package:installer (signed)" }
      - name: Sign out of Azure
        if: always()
        run: az account clear
      - name: Build update metadata from the signed output
        env:
          # Bundle the signed sidecar copy in the MCPB instead of native/bin.
          EXPLORE_BETTER_MCPB_SIDECAR: dist/win-unpacked/resources/native/ExploreBetterMcp.exe
        run: |
          $releaseSteps = @('verify:packaged-terminal', 'build:mcpb', 'verify:mcpb', 'verify:mcp-release', 'verify:brand', 'build:update-feed', 'build:release-checksums', 'verify:release-checksums')
          foreach ($releaseStep in $releaseSteps) {
            npm run $releaseStep
            if ($LASTEXITCODE -ne 0) { throw "Release step failed: $releaseStep" }
          }
      - name: Require trusted, timestamped Authenticode signatures
        env:
          EXPLORE_BETTER_SIGNING_SUBJECT: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME }}
        run: npm run verify:production-signing
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExploreBetter-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          path: |
            dist/ExploreBetter-*-x64-setup.exe
            dist/ExploreBetter-*-x64-setup.exe.blockmap
            dist/update-feed/latest.yml
            dist/SHA256SUMS.txt
            dist/mcp/ExploreBetter-MCP-*-windows-x64.mcpb
            dist/mcp/SHA256SUMS-mcp.txt
            dist/mcp/manifest.json
            dist/mcp/server.json
            artifacts/production-signing-latest.md

  # Runs no repository code: it only attests the exact bytes produced by whichever
  # build job ran (exactly one does) and places them on a draft release for a
  # maintainer to publish.
  publish:
    needs: [build, build-signed]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build output
        # v8 fails on artifact digest mismatches by default.
        uses: actions/download-artifact@v8
        with:
          name: ExploreBetter-${{ github.ref_name }}-windows-x64
          path: .
      - name: Protect published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $releaseResponse = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$([Uri]::EscapeDataString($tag))" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30 -ErrorAction Stop
          if ($releaseResponse.StatusCode -eq 404) { exit 0 }
          if ($releaseResponse.StatusCode -ne 200) {
            throw "Release lookup failed with HTTP $($releaseResponse.StatusCode). Refusing to assume the release is absent."
          }
          $release = $releaseResponse.Content | ConvertFrom-Json -ErrorAction Stop
          if ($release.tag_name -cne $tag -or $release.draft -isnot [bool]) {
            throw "Release lookup returned invalid or mismatched metadata."
          }
          if ($release.draft -ne $true) {
            throw "Release $tag is already published. Refusing to rebuild or replace its public assets. Create a new version and tag instead."
          }
      - name: Attest release checksums
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt
      - name: Attest MCP bundle checksums
        uses: actions/attest@v4
        with:
          subject-checksums: dist/mcp/SHA256SUMS-mcp.txt
      - name: Create or update draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          function Get-Release {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            $response = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$([Uri]::EscapeDataString($tag))" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30 -ErrorAction Stop
            if ($response.StatusCode -eq 200) {
              $release = $response.Content | ConvertFrom-Json -ErrorAction Stop
            } elseif ($response.StatusCode -eq 404) {
              # The tag endpoint only returns published releases; drafts are found by listing.
              $listResponse = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30 -ErrorAction Stop
              if ($listResponse.StatusCode -ne 200) {
                throw "Release listing failed with HTTP $($listResponse.StatusCode). Refusing to assume the release is absent."
              }
              $listed = $listResponse.Content | ConvertFrom-Json -ErrorAction Stop
              $drafts = @($listed | Where-Object { $_.tag_name -ceq $tag -and $_.draft -eq $true })
              if ($drafts.Count -gt 1) { throw "Multiple draft releases exist for $tag. Remove the extras before publishing." }
              if ($drafts.Count -eq 0) { return $null }
              $release = $drafts[0]
            } else {
              throw "Release lookup failed with HTTP $($response.StatusCode). Refusing to assume the release is absent."
            }
            if ($release.tag_name -cne $tag -or $release.draft -isnot [bool]) {
              throw "Release lookup returned invalid or mismatched metadata."
            }
            return $release
          }
          $installer = Get-ChildItem -LiteralPath dist -Filter "ExploreBetter-*-x64-setup.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem -LiteralPath dist -Filter "ExploreBetter-*-x64-setup.exe.blockmap" | Select-Object -First 1
          $mcpb = Get-ChildItem -LiteralPath dist/mcp -Filter "ExploreBetter-MCP-*-windows-x64.mcpb" | Select-Object -First 1
          $release = Get-Release
          if ($null -eq $release) {
            gh release create $tag --draft --verify-tag --generate-notes --title "Explore Better $tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $tag." }
            $release = Get-Release
          }
          if ($null -eq $release -or $release.draft -ne $true) {
            throw "Release $tag is not a verified draft. Refusing to upload assets."
          }
          gh release upload $tag `
            $installer.FullName `
            $blockmap.FullName `
            dist/update-feed/latest.yml `
            dist/SHA256SUMS.txt `
            $mcpb.FullName `
            dist/mcp/SHA256SUMS-mcp.txt `
            dist/mcp/manifest.json `
            artifacts/production-signing-latest.md
          if ($LASTEXITCODE -ne 0) { throw "Could not upload assets to draft release $tag. Existing assets are never replaced; use a new version for changed bytes." }
