name: Windows CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The tag-driven release workflow calls this workflow as its test gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow resolves to the caller's name under workflow_call, so the
  # release gate never shares (or deadlocks on) a group with push/PR CI runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EXPLORE_BETTER_DISABLE_STATE_WATCH: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.12
          cache-dependency-path: |
            native/fshelper/go.mod
            native/mcpserver/go.sum
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:privacy
      - run: npm run verify:brand
      - run: npm run build:native-helper
      - run: npm run build:renderer
      # build:mcpb also rebuilds the MCP sidecar (build:mcp-server).
      - run: npm run build:mcpb
      - name: Confirm committed native binaries match their Go sources
        run: git diff --exit-code --stat -- native/bin
      - run: npm run verify:terminal-service
      - run: npm run verify:desktop-lifecycle
      - run: npm run verify:terminal-native-lifecycle
      - run: npm run verify:desktop-session
      - run: npm run verify:backend-integrity
      - run: npm run verify:backend-round-two
      - run: npm run verify:backend-operation-wait
      - run: npm run verify:mcp-reliability
      - run: npm run verify:mcp-lifecycle
      - run: npm run verify:mcp-policy-regression
      - run: npm run verify:mcp-client-roots
      - run: npm run verify:mcp-clients
      - run: npm run verify:mcp-operations
      - name: Native protocol tests
        working-directory: native/mcpserver
        env:
          GOTOOLCHAIN: go1.25.12
        run: go test ./...
      - name: Native filesystem tests
        working-directory: native/fshelper
        run: go test ./...
      - run: npm run verify:security-boundary
      - run: npm run verify:transactional-operations
      - run: npm run verify:shell-quoting
      - run: npm run verify:shell-registry
      - run: npm run verify:rename-retry-safety
      - run: npm run verify:listing-index-regression
      - run: npm run verify:short-path-watch
      - run: npm run verify:trusted-script-timeout
      - run: npm run verify:auto-refresh-fallback
      - run: npm run verify:operations
      - run: npm run verify:operation-journal
      - run: npm run verify:crash-kill
      - run: npm run verify:state-corruption
      - run: npm run verify:mcp-security
      - run: npm run verify:mcp-contract
      - run: npm run verify:native-helper
      - run: npm run verify:terminal
      - run: npm run verify:mcp-value
      - run: npm run verify:mcp-context
      - run: npm run verify:mcp-ui-views
      - run: npm run verify:mcp-semantic-ui
      - run: npm run verify:mcp-operation-wait
      - run: npm run verify:mcpb
      - run: npm run verify:seo-discovery
      - run: npm run verify:layout
      - run: npm run verify:interaction-quality
      - run: npm run verify:renderer-state
      - run: npm run verify:renderer-async
      - run: npm run verify:clipboard-sequence
      - run: npm run verify:mcp-release
      - run: npm run verify:azure-signing-config
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/*latest.json
            artifacts/*latest.md
            artifacts/*latest*.png
            artifacts/interaction-quality-*/workspace.png
            artifacts/renderer-state-*/**/*.png
